<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Franz Amoroso · Portfolio</title>
  <meta name="description" content="Franz Amoroso — System Test Engineer. Esperienze, formazione, competenze, progetti e risorse.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css"> 
</head>
<body>

  <!-- Cielo fisso: stelle, luna, crepuscolo, colline -->
  <div class="sky" aria-hidden="true">
    <svg class="stars" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <g fill="#F4F1E6">
        <circle cx="80" cy="60" r="1.2"/><circle cx="190" cy="140" r="0.9"/><circle cx="310" cy="40" r="1.4"/><circle cx="420" cy="210" r="0.8"/><circle cx="530" cy="90" r="1.1"/><circle cx="640" cy="30" r="0.9"/><circle cx="720" cy="170" r="1.3"/><circle cx="810" cy="70" r="0.8"/><circle cx="900" cy="250" r="1"/><circle cx="960" cy="120" r="1.5"/><circle cx="1050" cy="40" r="0.9"/><circle cx="1130" cy="200" r="1.2"/><circle cx="1220" cy="90" r="0.8"/><circle cx="1300" cy="30" r="1.3"/><circle cx="1390" cy="160" r="1"/><circle cx="140" cy="300" r="0.9"/><circle cx="260" cy="380" r="1.2"/><circle cx="380" cy="320" r="0.7"/><circle cx="590" cy="290" r="1"/><circle cx="690" cy="400" r="0.8"/><circle cx="860" cy="350" r="1.1"/><circle cx="1010" cy="420" r="0.8"/><circle cx="1180" cy="330" r="1.2"/><circle cx="1340" cy="400" r="0.9"/><circle cx="40" cy="470" r="1"/><circle cx="470" cy="480" r="0.9"/><circle cx="760" cy="520" r="0.7"/><circle cx="1240" cy="520" r="1"/>
      </g>
    </svg>
    <div class="moon"><span></span><span></span><span></span><span></span></div>
    <div class="dusk"></div>
    <svg class="hills" viewBox="0 0 1440 240" preserveAspectRatio="none">
      <path d="M0 120 C 180 60, 320 90, 470 110 S 760 40, 940 80 S 1240 30, 1440 90 L1440 240 L0 240 Z" fill="#0B1226"/>
      <path d="M0 170 C 220 120, 420 160, 640 150 S 1000 110, 1200 140 S 1380 150, 1440 140 L1440 240 L0 240 Z" fill="#060A18"/>
    </svg>
  </div>

  <main>
    <!-- Introduzione -->
    <section class="hero" id="intro">
      <button class="photo-btn" data-photo aria-label="Ingrandisci la foto">
        <img id="hero-foto" alt="Foto di Franz Amoroso" width="88" height="88">
      </button>
      <h1 id="hero-nome"></h1>
      <div class="hero-text">
        <p class="ruolo" id="hero-ruolo"></p>
        <p class="sottotitolo" id="hero-sottotitolo"></p>
      </div>
      <div class="hero-actions">
        <!-- Implementare quando si aggiorna il CV -->
        <!-- <a class="btn btn-primary only-desktop" id="hero-cv" download>Scarica CV</a> -->
        <a class="btn" id="hero-github" target="_blank" rel="noopener">GitHub</a>
        <a class="btn" id="hero-linkedin" target="_blank" rel="noopener">LinkedIn</a>
      </div>
      <a class="scroll-hint" href="#pannelli">
        <span>SCORRI</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg>
      </a>
    </section>

    <!-- Due pannelli -->
    <section class="panels" id="pannelli">
      <aside class="glass side">
        <button class="back only-mobile" id="back" aria-label="Torna all'elenco">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="profile">
          <button class="photo-btn" data-photo aria-label="Ingrandisci la foto">
            <img id="side-foto" alt="" width="56" height="56">
          </button>
          <div>
            <div class="profile-name" id="side-nome"></div>
            <div class="profile-role" id="side-qualifica"></div>
          </div>
        </div>
        <p class="bio" id="side-bio"></p>
        <div class="eyebrow muted label-esplora">ESPLORA</div>
        <nav class="cat-nav" id="cat-nav" aria-label="Categorie"></nav>
        <div class="langs" id="side-lingue"></div>
      </aside>

      <article class="glass detail" id="detail" aria-live="polite"></article>
    </section>

    <footer class="footer">© <span id="anno"></span> Franz Amoroso</footer>
  </main>

  <!-- Foto ingrandita -->
  <dialog id="lightbox" aria-label="Foto di Franz Amoroso">
    <img id="lightbox-img" alt="Foto di Franz Amoroso">
    <button class="icon-btn close" data-close aria-label="Chiudi la foto">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mobile.js"></script>
</body>
</html>
