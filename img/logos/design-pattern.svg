<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Design pattern</title>
  <!-- collegamenti -->
  <g stroke="#9FB0CF" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M64 42 V58 M64 58 H32 V78 M64 58 H96 V78"/>
  </g>
  <!-- classe astratta in alto -->
  <rect x="38" y="10" width="52" height="34" rx="7" fill="#E9DFC0"/>
  <rect x="38" y="10" width="52" height="11" rx="7" fill="#CFC39E"/>
  <rect x="38" y="16" width="52" height="5" fill="#CFC39E"/>
  <!-- triangolo di ereditarietà -->
  <path d="M64 44 l-7 11 h14 z" fill="#060A16" stroke="#9FB0CF" stroke-width="3" stroke-linejoin="round"/>
  <!-- due implementazioni -->
  <rect x="8" y="78" width="48" height="38" rx="7" fill="#5EC8C0"/>
  <rect x="8" y="78" width="48" height="12" rx="7" fill="#3FA59D"/>
  <rect x="8" y="84" width="48" height="6" fill="#3FA59D"/>
  <rect x="72" y="78" width="48" height="38" rx="7" fill="#6F9CEB"/>
  <rect x="72" y="78" width="48" height="12" rx="7" fill="#4F7FD6"/>
  <rect x="72" y="84" width="48" height="6" fill="#4F7FD6"/>
  <!-- righe dei membri -->
  <g fill="#060A16" opacity="0.35">
    <rect x="46" y="28" width="30" height="4" rx="2"/><rect x="46" y="35" width="20" height="4" rx="2"/>
    <rect x="15" y="97" width="30" height="4" rx="2"/><rect x="15" y="104" width="20" height="4" rx="2"/>
    <rect x="79" y="97" width="30" height="4" rx="2"/><rect x="79" y="104" width="20" height="4" rx="2"/>
  </g>
</svg>
